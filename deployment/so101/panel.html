<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiOS SO101 部署</title>
<style>body{font:15px system-ui;background:#f4f6f8;color:#24303b;margin:0}main{max-width:1100px;margin:auto;padding:28px}h1{font-size:25px}header{display:flex;justify-content:space-between;align-items:center}#state{color:#087e70}.note{background:#e3f3ef;padding:14px;border-radius:6px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:24px}.camera{background:white;padding:14px}.camera img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:#17232e}h2{font-size:16px}.stats{display:flex;flex-wrap:wrap;gap:36px;padding:24px 0;border-bottom:1px solid #d6dfe5}.metric b{display:block;font-size:26px;margin:6px 0}.metric span{font-size:12px;color:#60717e}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:18px;line-height:1.7}footer{font-size:12px;color:#60717e;line-height:1.8;margin-top:20px}@media(max-width:700px){main{padding:16px}.grid{grid-template-columns:1fr}.camera img{max-height:300px}}</style>
<main><header><h1>LiOS · SO101 实时推理</h1><span id="state">连接中</span></header>
<p id="mode" class="note">观测与预测模式：读取三路相机和左右臂状态，生成动作预测。电机动作执行未启用。</p>
<button id="stop-motion" style="background:#b42318;color:white;border:0;padding:14px 24px;font-size:18px;border-radius:6px;cursor:pointer">停止动作并保持姿态</button><span id="stop-status" style="margin-left:12px"></span><div class="stats"><div class="metric"><span>模型</span><b id="checkpoint">--</b></div><div class="metric"><span>已接收动作块</span><b id="count">0</b></div><div class="metric"><span>最近推理耗时</span><b id="latency">--</b></div><div class="metric"><span>电机指令发送数</span><b id="commands">0</b></div></div>
<div class="grid"><div class="camera"><h2 id="label-mid">正面 · mid</h2><img id="mid" alt="等待正面图像"></div><div class="camera"><h2 id="label-left">左腕 · left</h2><img id="left" alt="等待左腕图像"></div><div class="camera"><h2 id="label-right">右腕 · right</h2><img id="right" alt="等待右腕图像"></div></div>
<h2>关节状态与最新预测</h2><pre id="details">等待数据</pre><footer>原工程链路：WebRTC → 图传 receiver / CUDA IPC → PI0.5 → WebSocket 动作通道。<br>信令 18080 · 图像 5082 · 状态/动作 18081</footer></main>
<script>const $=id=>document.getElementById(id);async function tick(){try{const r=await fetch('/status');if(!r.ok)throw Error(r.status);const d=await r.json(),i=d.inference||{},s=d.state||{},a=d.action||{};const e=d.execution||{},running=e.status==='running'&&d.now-e.updated_at<2;$('commands').textContent=e.motor_commands_sent||0;$('mode').textContent=running?(e.mode==='full_task'?`叠衣服连续执行中：双臂与夹爪由模型控制；已运行 ${(e.elapsed_s||0).toFixed(1)} / ${e.duration_limit_s} 秒。`:'低速关节试运行：最多 3 秒、3°/秒、相对起点最多 5°；夹爪保持。'):(e.executed?'动作执行已停止，当前继续观察与预测。'+(e.error?'停止原因：'+e.error:''):'观察与预测模式，未执行关节动作。');const ages=[d.now-i.updated_at,d.now-s.updated_at,d.now-a.received_at];const ready=['ready','predicting'].includes(i.status)&&ages.every(x=>Number.isFinite(x)&&x<5);$('state').textContent=ready?'实时预测中':({loading:'模型加载中',warming_up:'模型预热中',waiting_for_observations:'等待实时观测',failed:'推理服务异常',stopped:'推理服务已停止'}[i.status]||'等待数据更新');$('checkpoint').textContent=`step${d.config.checkpoint_step}`;$('count').textContent=a.received_chunks||0;$('latency').textContent=i.last_inference_s?(i.last_inference_s*1000).toFixed(0)+' ms':'--';const f=x=>x?.map(v=>v.toFixed(2)).join(', ')||'--';$('details').textContent=`左臂状态：${f(s.last_state?.left_arm?.positions)}\n右臂状态：${f(s.last_state?.right_arm?.positions)}\n\n左臂预测第一帧：${f(a.message?.left_arm?.actions?.[0])}\n右臂预测第一帧：${f(a.message?.right_arm?.actions?.[0])}\n\n单位：关节为度，夹爪为 0–100\n动作块：${d.config.horizon} 帧，间隔 ${(1000/d.config.fps).toFixed(2)} ms\n预测新鲜度：${Number.isFinite(ages[2])?ages[2].toFixed(1)+' 秒前':'--'}`;for(const k of ['mid','left','right']){$('label-'+k).textContent=({mid:'正面',left:'左腕',right:'右腕'}[k])+' · '+(d.camera_devices?.[k]||k)}}catch(e){$('state').textContent='连接中断'}finally{setTimeout(tick,250)}}for(const k of ['mid','left','right']){const img=$(k);const connect=()=>{img.src=`/stream/${k}?t=${Date.now()}`};img.onerror=()=>setTimeout(connect,1000);connect()}$('stop-motion').onclick=async()=>{try{const r=await fetch('/stop-motion',{method:'POST'});if(!r.ok)throw Error(r.status);$('stop-status').textContent='已请求停止；等待执行端保持姿态'}catch(e){$('stop-status').textContent='停止请求失败，请在终端停止执行服务'}};tick();</script></html>
