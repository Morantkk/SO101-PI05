<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SO101-PI05 Training</title>
<style>
*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:#f6f7f9;color:#20252b;font:14px system-ui,sans-serif}header{padding:20px 28px;background:#fff;border-bottom:1px solid #dce1e7;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{margin:0;font-size:22px}#status{color:#087f69}main{max-width:1280px;padding:24px;margin:auto}#experiment{font-family:monospace;overflow-wrap:anywhere;color:#5d6773}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-block:1px solid #dce1e7;margin-top:20px;padding:20px 0;gap:20px}.label{font-size:12px;color:#66707d;margin-bottom:8px}.value{font-size:24px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.bar{height:6px;background:#dce1e7;margin:20px 0 8px}.bar div{height:100%;background:#078878;width:0}#detail,#gpu,#paths{color:#576471;line-height:1.8;overflow-wrap:anywhere}section{padding-top:24px}h2{font-size:15px;margin:0 0 14px}canvas{width:100%;height:280px;background:#fff;border:1px solid #e0e4e9}pre{height:260px;overflow:auto;padding:16px;background:#20252b;color:#dce8e6;border-radius:4px;font:12px/1.6 monospace;white-space:pre-wrap;overflow-wrap:anywhere}#error{color:#b42318}footer{border-top:1px solid #dce1e7;margin-top:24px;padding:16px 0;font-size:12px}@media(max-width:640px){header{padding:16px}main{padding:16px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.value{font-size:21px}canvas{height:220px}}
</style>
<header><h1>SO101-PI05 Training</h1><span id="status">连接中</span></header>
<main>
<div id="experiment"></div><div id="error"></div>
<div class="metrics">
<div><div class="label">STEP</div><div class="value" id="step">0</div></div>
<div><div class="label">EPOCH</div><div class="value" id="epoch">0 / 5</div></div>
<div><div class="label">TRAIN LOSS</div><div class="value" id="loss">--</div></div>
<div><div class="label">LEARNING RATE</div><div class="value" id="lr">--</div></div>
</div>
<div class="bar"><div id="bar"></div></div><div id="detail"></div>
<section><h2>训练损失</h2><canvas id="chart"></canvas></section>
<section id="validation-section" hidden><h2 id="validation-title">验证损失</h2><div id="validation"></div><canvas id="validation-chart"></canvas></section>
<section><h2>GPU</h2><div id="gpu">--</div></section>
<section><h2>运行日志</h2><pre id="logs"></pre></section>
<footer id="paths"></footer>
</main>
<script>
const $=id=>document.getElementById(id);let lastData=null;
function duration(s){if(!Number.isFinite(s)||s<0)return '--';const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return `${h}h ${m}m ${Math.floor(s%60)}s`}
function plot(records,canvasId,color,emptyText){const c=$(canvasId),rect=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=rect.width*dpr;c.height=rect.height*dpr;const ctx=c.getContext('2d');ctx.scale(dpr,dpr);const w=rect.width,h=rect.height,p=42;ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.font='11px system-ui';if(!records.length){ctx.fillStyle='#66707d';ctx.fillText(emptyText,p,h/2);return}const max=Math.max(...records.map(r=>r.loss))*1.1||1;ctx.strokeStyle='#e6eaee';ctx.fillStyle='#66707d';for(let i=0;i<=4;i++){const y=h-p-(h-2*p)*i/4;ctx.beginPath();ctx.moveTo(p,y);ctx.lineTo(w-12,y);ctx.stroke();ctx.fillText((max*i/4).toFixed(3),3,y+4)}const end=Math.max(10,records.at(-1).step);ctx.strokeStyle=color;ctx.lineWidth=1.8;ctx.beginPath();records.forEach((r,i)=>{const x=p+(w-p-14)*r.step/end,y=h-p-(h-2*p)*r.loss/max;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillText('0',p,h-14);ctx.fillText(`${end} step`,Math.max(p,w-80),h-14)}
async function refresh(){
  try{
    const response=await fetch('/api/status');
    if(!response.ok)throw Error(response.status);
    const d=await response.json();lastData=d;
    const validationEnabled=(d.config?.data?.test_ep_num??0)>0;
    const interval=d.config?.test_step_interval;
    $('validation-section').hidden=!validationEnabled;
    $('validation-title').textContent=interval?`验证损失（每 ${interval.toLocaleString()} 步评估）`:'验证损失';
    const val=d.validation_metrics?.at(-1);
    $('validation').textContent=val?`最近验证：Step ${val.step.toLocaleString()} · Loss ${val.loss.toFixed(6)}`:interval?`等待第 ${interval.toLocaleString()} 步评估`:'等待验证记录';
    const latest=d.metrics.at(-1),step=d.latest_step,pct=100*step/d.total_steps;
    const labels={starting:'准备中',running:step?'训练中':'加载中',completed:'训练完成',failed:'训练失败'};
    $('status').textContent=labels[d.status]||d.status;
    $('status').style.color=d.status==='failed'?'#b42318':'#087f69';
    $('experiment').textContent=d.experiment;
    $('step').textContent=`${step.toLocaleString()} / ${d.total_steps.toLocaleString()}`;
    $('epoch').textContent=`${Math.min(d.epochs,step/d.steps_per_epoch).toFixed(2)} / ${d.epochs}`;
    $('loss').textContent=latest?latest.loss.toFixed(5):'--';
    $('lr').textContent=latest?latest.lr.toExponential(2):'--';
    $('bar').style.width=`${Math.min(100,pct)}%`;
    const recent=d.metrics.slice(-31),speed=recent.length>1?(recent.at(-1).elapsed_s-recent[0].elapsed_s)/(recent.at(-1).step-recent[0].step):NaN;
    const frozen=d.config?.frozen??d.frozen;
    const mode=frozen===true?'冻结视觉语言主干':frozen===false?'全参数微调':'训练模式未知';
    $('detail').textContent=`${pct.toFixed(2)}% · Batch ${d.batch_size} · ${mode} · ${validationEnabled?'启用验证':'无验证集'} · 已运行 ${duration(d.elapsed_s)} · 预计剩余 ${duration((d.total_steps-step)*speed)}`;
    $('gpu').textContent=d.gpu?`${d.gpu.name} · 显存 ${(d.gpu.used_mib/1024).toFixed(1)} / ${(d.gpu.total_mib/1024).toFixed(1)} GiB · 利用率 ${d.gpu.utilization}% · ${d.gpu.temperature} °C`:'--';
    const logs=$('logs'),atBottom=logs.scrollTop+logs.clientHeight>=logs.scrollHeight-40;
    logs.textContent=d.log;if(atBottom)logs.scrollTop=logs.scrollHeight;
    $('paths').textContent=`Checkpoint: ${d.checkpoint_dir}\nLog: ${d.log_path}`;
    $('error').textContent='';
    plot(d.metrics,'chart','#078878','等待训练指标');
    if(validationEnabled)plot(d.validation_metrics||[],'validation-chart','#7257c8','等待验证记录');
  }catch(e){$('error').textContent=`连接中断: ${e.message}`}finally{setTimeout(refresh,3000)}
}
window.addEventListener('resize',()=>{if(lastData){plot(lastData.metrics,'chart','#078878','等待训练指标');if(!$('validation-section').hidden)plot(lastData.validation_metrics||[],'validation-chart','#7257c8','等待验证记录')}});refresh();
</script>
</html>
